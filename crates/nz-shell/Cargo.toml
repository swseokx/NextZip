[package]
name = "nz-shell"
description = "NextZip Explorer context menu (IExplorerCommand COM server)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "nextzip_shell"
crate-type = ["cdylib", "rlib"]

[dependencies]
nz-front.workspace = true
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell_PropertiesSystem",
]

# COM exports need `unsafe`; everything else in the workspace forbids it.
[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile.workspace = true
