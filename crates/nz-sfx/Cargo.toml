[package]
name = "nz-sfx"
description = "NextZip self-extractor stub (x64 / ARM64): extracts the 7z archive appended to its own .exe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nz-sfx"
path = "src/main.rs"

[dependencies]
nz-front.workspace = true
anyhow.workspace = true
# Decoder only: LZMA / LZMA2 / BCJ are built in; Deflate for the 7z "fast"
# class. No encoder, no AES (SFX archives are not encrypted).
sevenz-rust2 = { version = "0.24", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true
nz-create.workspace = true
nz-archive.workspace = true

# MessageBoxW needs `unsafe`; like nz-sandbox, this crate is exempt from the
# workspace-wide `unsafe_code = "forbid"`.
[lints.clippy]
all = { level = "warn", priority = -1 }
