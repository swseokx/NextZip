[package]
name = "nz-sys"
description = "NextZip: small OS shim (Windows processor groups) kept apart so the rest of the workspace stays free of unsafe code"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_Security"] }

# Besides nz-xz, this is the only crate that contains `unsafe` code (Win32
# calls). Everything else keeps `unsafe_code = "forbid"`.
[lints.clippy]
all = { level = "warn", priority = -1 }
