[package]
name = "nz-sandbox"
description = "NextZip: lock down the isolated decoder process (low integrity, job object, mitigations) and contain it from the parent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Console",
] }

[dev-dependencies]
tempfile.workspace = true

# Win32 calls need `unsafe`; like nz-sys, this crate is exempt from the
# workspace-wide `unsafe_code = "forbid"`.
[lints.clippy]
all = { level = "warn", priority = -1 }
