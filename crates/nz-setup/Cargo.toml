[package]
name = "nz-setup"
description = "NextZip per-user installer and uninstaller"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "nextzip-setup"
path = "src/main.rs"

[lib]
name = "nz_setup"
path = "src/lib.rs"

[dependencies]
nz-front.workspace = true
anyhow.workspace = true
zstd.workspace = true

[build-dependencies]
zstd.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile.workspace = true

# Registry and COM calls need `unsafe`; everything else in the workspace forbids it.
[lints.clippy]
all = { level = "warn", priority = -1 }
