# Coverage-guided fuzzing (cargo-fuzz + libFuzzer, nightly toolchain).
# Kept out of the workspace so stable `cargo build/test` never touches it.
#
#   cargo +nightly fuzz run archive fuzz/corpus/archive
#
# Seed corpus: NZ_FUZZ_CORPUS=fuzz/corpus cargo test -p nz-archive --test fuzz_smoke
[package]
name = "nz-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nz-archive = { path = "../crates/nz-archive" }
nz-formats = { path = "../crates/nz-formats" }
nz-nzf = { path = "../crates/nz-nzf" }

[workspace]

# Same patched crates as the main workspace, plus sevenz-rust2 without its
# cdylib target (see third_party/README.md).
[patch.crates-io]
lzxd = { path = "../third_party/lzxd" }
sevenz-rust2 = { path = "../third_party/sevenz-rust2" }
unarc-rs = { path = "../third_party/unarc-rs" }

[[bin]]
name = "archive"
path = "fuzz_targets/archive.rs"
test = false
doc = false
bench = false

